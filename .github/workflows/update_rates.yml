name: Run Remittance Scraper

on:
  schedule:
    # Runs 3 times a day (Every 8 hours: at 00:00, 08:00, and 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch: # Allows you to run it manually anytime for testing!

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gives the robot permission to update rates.json

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push Updated Rates
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add rates.json
        git diff-index --quiet HEAD || (git commit -m "Automated rates update" && git push)
