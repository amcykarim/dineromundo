<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Configura tu negocio | DineroMundo</title><meta name="description" content="Completa la configuración inicial de tu negocio en DineroMundo."><link rel="icon" href="../../assets/favicon.svg"><link rel="stylesheet" href="../../assets/css/styles.css"><link rel="stylesheet" href="../../assets/css/account.css"></head>
<body><a class="skip-link" href="#contenido">Saltar al contenido principal</a><main id="contenido"><section class="account-hero"><div class="container account-wrap"><a class="brand" href="../../"><span>Dinero</span>Mundo</a><p class="eyebrow">Paso 1 de 1</p><h1>Configura tu negocio</h1><p>Estos datos sirven como valores iniciales. Podrás cambiarlos después.</p></div></section><section class="section"><div class="container account-wrap"><article class="account-card"><p data-account-message class="account-message" role="status" aria-live="polite" hidden></p><form class="account-form" data-onboarding-form><label>Nombre del negocio<input name="businessName" autocomplete="organization" maxlength="160" required></label><label>País<input name="country" autocomplete="country-name" maxlength="100" required></label><label>Moneda predeterminada<select name="defaultCurrency"><option>USD</option><option>MXN</option><option>COP</option><option>PEN</option><option>CLP</option><option>ARS</option><option>EUR</option></select></label><label>Zona horaria<input name="timezone" maxlength="100" required></label><label>Identificación fiscal <span class="optional">opcional</span><input name="taxId" maxlength="80"></label><button class="btn btn-primary" type="submit">Guardar y entrar</button></form><div class="account-links"><a href="../../negocios/">Omitir por ahora</a><a href="../../privacidad/">Privacidad</a></div></article></div></section></main><script src="../../assets/js/main.js" defer></script><script src="../../assets/js/account/onboarding-app.js" defer></script></body></html>
